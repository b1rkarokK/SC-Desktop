<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Присоединиться - SC Desk</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; --bg:#1a1a1a; --panel:#222; --text:#e8e8e8; --muted:#8c8c8c; --accent:#ff5500; --border:#333; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font:16px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { width:100%; max-width:440px; padding:28px; border:1px solid var(--border); border-radius:14px; background:var(--panel); text-align:center; }
  h1 { margin:0 0 6px; font-size:22px; font-weight:600; }
  p { margin:0 0 18px; color:var(--muted); }
  .row { display:grid; gap:10px; }
  a.btn { display:block; padding:11px 16px; border:1px solid var(--border); border-radius:8px; color:var(--text); text-decoration:none; font-weight:600; }
  a.btn:hover { border-color:var(--muted); }
  a.primary { border-color:var(--accent); background:var(--accent); color:#fff; }
  a.primary:hover { filter:brightness(1.1); }
  small { display:block; margin-top:16px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Открываем SC Desk…</h1>
  <p id="text">Если окно не появилось, нажмите кнопку ниже.</p>
  <div class="row">
    <a class="btn primary" id="open" href="#">Открыть в SC Desk</a>
    <a class="btn" href="https://github.com/b1rkarokK/SC-Desktop/releases/latest">Скачать SC Desk</a>
  </div>
  <small>SC Desk - бесплатный клиент SoundCloud для Windows. Слушать вместе можно только в программе.</small>
</main>
<script>
(function () {
  // #room/<код> or #playlist/<код>#<ключ> : the link the status button leads to
  var m = /^#(room|playlist)\/([A-Za-z0-9_-]{16,64})(?:#([A-Za-z0-9_-]{20,80}))?$/.exec(location.hash);
  var open = document.getElementById('open');
  if (!m) {
    document.getElementById('title').textContent = 'Ссылка не распознана';
    document.getElementById('text').textContent = 'Попросите прислать приглашение ещё раз или скачайте программу.';
    open.style.display = 'none';
    return;
  }
  var link = 'scdesk://' + m[1] + '/' + m[2] + (m[3] ? '#' + m[3] : '');
  open.href = link;
  if (m[1] === 'playlist') document.getElementById('title').textContent = 'Открываем общий плейлист…';
  // a moment for the page to show, then hand the link to Windows (nothing happens if the program is not there)
  setTimeout(function () { location.href = link; }, 400);
})();
</script>
</body>
</html>
