# Release: push a tag like v0.2.0 →
#   1. builds the Windows installer (NSIS),
#   2. signs the update with TAURI_SIGNING_PRIVATE_KEY,
#   3. publishes a GitHub Release with the changelog section for that version
#      and latest.json (what installed apps poll for updates).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # whisper.cpp bindings (src-tauri/.cargo/config.toml): the runner's own LLVM
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # same key as cache.yml on main: release builds reuse its cache
          shared-key: release

      - run: npm ci

      - name: Changelog for this version
        id: notes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## \[?$([regex]::Escape($version))\]?[^\n]*\n(.*?)(?=^## |\z)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { 'Исправления и улучшения.' }
          if (Test-Path CHANGELOG.en.md) {
            $en = [regex]::Match((Get-Content CHANGELOG.en.md -Raw -Encoding utf8), "(?ms)^## \[?$([regex]::Escape($version))\]?[^\n]*\n(.*?)(?=^## |\z)")
            if ($en.Success) { $body = $body + "`n`n---`n**English**`n`n" + $en.Groups[1].Value.Trim() }
          }
          "body<<NOTES_EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "NOTES_EOF" >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SC Desk ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  # the Android app: built after the release exists (the job above makes it), then its package and the feed the
  # app updates itself from (latest-android.json) are put into the same release
  android:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      # the proxy engine of the app (sing-box), built the same way as on the developer's machine
      - name: Proxy engine
        shell: pwsh
        run: ./scripts/build-singbox.ps1 -Work "$env:RUNNER_TEMP\gobuild"

      - name: Signing key
        shell: pwsh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          [IO.File]::WriteAllBytes("android/release.jks", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_B64))

      - name: Build the package
        working-directory: android
        shell: pwsh
        env:
          ANDROID_KEYSTORE_FILE: release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $p = $v.Split('.')
          $code = [int]$p[0] * 10000 + [int]$p[1] * 100 + [int]$p[2]
          ./gradlew.bat assembleRelease "-PappVersion=$v" "-PappCode=$code" --no-daemon --console=plain

      - name: Put the package and the feed into the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $v = $tag.TrimStart('v')
          $p = $v.Split('.')
          $code = [int]$p[0] * 10000 + [int]$p[1] * 100 + [int]$p[2]
          $src = Get-ChildItem android/app/build/outputs/apk/release/*arm64-v8a-release.apk | Select-Object -First 1
          $name = "SC-Desk-$v-android.apk"
          Copy-Item $src.FullName $name
          $sha = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $name).Length
          # the notes of this version from the changelog
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## \[?$([regex]::Escape($v))\]?[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { 'Исправления и улучшения.' }
          $feed = [ordered]@{
            version = $v
            versionCode = $code
            notes = $notes
            apk = [ordered]@{ url = "https://github.com/${{ github.repository }}/releases/download/$tag/$name"; sha256 = $sha; size = $size }
          }
          $json = $feed | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText("latest-android.json", $json, (New-Object Text.UTF8Encoding($false)))
          gh release upload $tag $name latest-android.json --clobber
